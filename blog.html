<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sektörel Haberler & Makaleler | Kraften Ambalaj</title>
    <!-- Modern Fonts -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="./logo.png" type="image/png">
    <link rel="stylesheet" href="./css/main.css?v=6">
</head>
<body>
    <!-- Glass Header -->
    <header id="main-header" class="glass-header scrolled">
        <div class="header-container">
            <a href="./index.html" class="logo" style="text-decoration: none;">
                <img src="./logo.png" alt="Kraften Logo" class="logo-img">
                <span class="logo-text">KRAFTEN</span>
            </a>
            <nav class="nav-links">
                <a href="./index.html#vision" class="nav-link" data-i18n="navVision">VİZYON</a>
                <a href="./index.html#products" class="nav-link" data-i18n="navProducts">ENDÜSTRİYEL ÇÖZÜMLER</a>
                <a href="./index.html#certificates" class="nav-link" data-i18n="navCertificates">SERTİFİKALAR</a>
                <a href="./blog.html" class="nav-link active" data-i18n="navBlog" style="color: var(--color-accent);">BLOG</a>
                <a href="./index.html#sustainability" class="nav-link" data-i18n="navSustainability">SÜRDÜRÜLEBİLİRLİK</a>
            </nav>
            <div class="header-actions">
                <button id="lang-toggle" class="btn-lang">EN</button>
                <a href="./index.html#contact" class="btn-primary" data-i18n="navContactBtn">İLETİŞİME GEÇİN</a>
            </div>
        </div>
    </header>

    <main style="padding-top: 100px;">
        <!-- Blog Hero -->
        <section class="hero-section" style="height: auto; min-height: 40vh; padding: 80px 20px 40px; text-align: center; justify-content: center;">
            <div class="hero-content" style="max-width: 800px; margin: 0 auto;">
                <a href="./index.html" style="color: var(--color-accent); text-decoration: none; font-size: 0.9rem; font-weight: 600; margin-bottom: 20px; display: inline-block;" data-i18n="blogBackToHome">← Anasayfaya Dön</a>
                <div class="hero-subtitle" data-i18n="blogHeroSubtitle">KRAFTEN INSIGHTS & NEWS</div>
                <h1 class="hero-title" style="font-size: 3.2rem;" data-i18n="blogHeroTitle">Ambalaj Dünyasından<br>Güncel Makaleler</h1>
            </div>
        </section>

        <!-- Blog Feed & Search -->
        <section class="section-padding" style="background-color: var(--color-bg);">
            <div class="container">
                <!-- Search & Filters -->
                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; margin-bottom: 40px; background: #FFFDFB; padding: 20px 30px; border-radius: 8px; border: 1px solid rgba(194, 150, 104, 0.15);">
                    <div id="blog-categories" class="category-filters" style="margin-top: 0;">
                        <button class="filter-btn active" data-cat="all" data-i18n="allCategories">Tüm Kategoriler</button>
                        <button class="filter-btn" data-cat="trendler">Trendler & Regülasyon</button>
                        <button class="filter-btn" data-cat="surdurulebilirlik">Sürdürülebilirlik</button>
                        <button class="filter-btn" data-cat="hijyen">Hijyen & Kalite</button>
                    </div>
                    <div style="position: relative; min-width: 280px;">
                        <input type="text" id="blog-search" placeholder="Haber veya makale ara..." data-i18n="blogSearchPlaceholder" class="admin-input" style="margin-bottom: 0; padding-left: 40px; border-radius: 20px;">
                        <i class="fas fa-search" style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--color-text-light);"></i>
                    </div>
                </div>

                <!-- Articles Grid -->
                <div id="blog-archive-grid" class="blog-grid" style="grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));">
                    <!-- Articles injected via JS -->
                </div>
            </div>
        </section>
    </main>

    <!-- BLOG ARTICLE READER MODAL -->
    <div id="blog-modal" class="modal-overlay hidden">
        <div class="modal-content corporate-modal" style="max-width: 800px;">
            <button id="close-blog-modal" class="btn-close"><i class="fas fa-times"></i></button>
            <div class="blog-modal-body">
                <img id="blog-modal-img" src="" alt="Blog Cover" style="width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 8px; margin-bottom: 20px;">
                <div id="blog-modal-meta" style="font-size: 0.85rem; color: var(--color-accent); font-weight: 600; margin-bottom: 12px; text-transform: uppercase;"></div>
                <h2 id="blog-modal-title" style="font-family: var(--font-serif); font-size: 2rem; color: var(--color-primary); margin-bottom: 20px; line-height: 1.2;"></h2>
                <div id="blog-modal-content" style="color: var(--color-text); font-size: 1.05rem; line-height: 1.8; white-space: pre-line;"></div>
            </div>
        </div>
    </div>

    <!-- Corporate Footer -->
    <footer class="corporate-footer">
        <div class="footer-container">
            <div class="footer-brand">
                <img src="./logo.png" alt="Kraften" class="footer-logo">
                <div class="footer-desc" data-i18n="footerDesc">
                    Yenilikçi ve sürdürülebilir ambalaj çözümleri.
                </div>
            </div>
            <div class="footer-links">
                <h4>İletişim</h4>
                <p>info@kraftenambalaj.com</p>
            </div>
        </div>
        <div class="footer-bottom">
            &copy; 2026 Kraften Ambalaj. Tüm hakları saklıdır.
        </div>
    </footer>

    <script type="module" src="./js/blog.js"></script>
</body>
</html>
