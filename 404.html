<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Sayfa Bulunamadı | Kraften Ambalaj</title>
    <link rel="icon" href="./logo.png" type="image/png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #F5F0EB;
            color: #0A1A12;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        .container {
            padding: 40px;
            background: #FFF;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            max-width: 500px;
        }
        .container img { height: 60px; margin-bottom: 20px; }
        .container h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            margin-bottom: 15px;
            color: #0A1A12;
        }
        .container p {
            color: #666;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        .btn {
            background: #C8A96E;
            color: #0A1A12;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
            padding: 12px 25px;
            border-radius: 6px;
            transition: background 0.3s;
        }
        .btn:hover { background: #b89555; }
    </style>
</head>
<body>
    <div class="container">
        <img src="./logo.png" alt="Kraften Logo">
        <h1>Sayfa Bulunamadı</h1>
        <p>Aradığınız sayfa taşınmış veya kaldırılmış olabilir. Anasayfamıza dönerek ürünlerimizi inceleyebilirsiniz.</p>
        <a href="https://www.kraftenambalaj.com/" class="btn">Anasayfaya Dön →</a>
    </div>
</body>
</html>
